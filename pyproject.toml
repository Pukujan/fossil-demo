[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fossil-demo"
version = "0.0.1"
description = "Ephemeral product shell for FOSSIL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
